# Positionals and temporals. Usage: docs/grammar/08-space-and-time.md
# All from the base dictionary (canon). Format: lexicon/SCHEMA.md

# ---- Motion positionals ------------------------------------------------------

- lemma: däya
  ipa: dæja
  pos: preposition
  gloss: down
  definition: Motion downward ("walking down something").
  status: canon
  source: [base-dict]

- lemma: asu
  ipa: asu
  pos: preposition
  gloss: up
  definition: Motion upward ("pushing up something"; "looked up", legend).
  status: canon
  source: [base-dict, legend]

- lemma: saae
  ipa: sa:e
  pos: preposition
  gloss: out of
  status: canon
  source: [base-dict]

- lemma: i'saae
  ipa: i.sa:e
  pos: preposition
  gloss: into
  parts: [saae]
  status: canon
  source: [base-dict]

- lemma: ayu
  ipa: aju
  pos: preposition
  gloss: toward, to
  definition: Motion towards something.
  status: canon
  source: [base-dict, legend]

- lemma: sula
  ipa: sula
  pos: preposition
  gloss: away
  definition: Motion away from something.
  status: canon
  source: [base-dict]

- lemma: äsaq
  ipa: æsak
  pos: preposition
  gloss: past
  status: canon
  source: [base-dict]

- lemma: uisa
  ipa: uisa
  pos: preposition
  gloss: over
  status: canon
  source: [base-dict]

- lemma: qaal
  ipa: ka:l
  pos: preposition
  gloss: onto
  status: canon
  source: [base-dict]

- lemma: eryet
  ipa: erjet
  pos: preposition
  gloss: off
  definition: Taking something off something.
  status: canon
  source: [base-dict]

- lemma: lium
  ipa: lium
  pos: preposition
  gloss: around
  status: canon
  source: [base-dict]

- lemma: nui
  ipa: nui
  pos: preposition
  gloss: along
  status: canon
  source: [base-dict]

- lemma: anash
  ipa: anaʃ
  pos: preposition
  gloss: across
  status: canon
  source: [base-dict]

- lemma: yurad
  ipa: jurad
  pos: preposition
  gloss: through
  status: canon
