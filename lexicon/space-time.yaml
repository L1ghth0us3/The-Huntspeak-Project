# ---- Temporals -----------------------------------------------------------------

- lemma: itâ
  ipa: itʌ
  pos: adverb
  gloss: now
  status: canon
  source: [base-dict, cheatsheet]

- lemma: eene
  ipa: e:ne
  pos: adverb
  gloss: later
  status: canon
  source: [base-dict, cheatsheet]

- lemma: ashad
  ipa: aʃad
  pos: preposition
  gloss: during
  status: canon
  source: [base-dict]
  notes: Division of labor with eshu "while" and nanaqa "at the same time" is not yet defined.

- lemma: avikh
  ipa: aviχ
  pos: preposition
  gloss: after
  definition: Also links clauses ("after we fight, we eat").
  status: canon
  source: [base-dict, enhanced]

- lemma: eshu
  ipa: eʃu
  pos: conjunction
  gloss: while
  definition: Simultaneous time; links clauses.
  status: canon
  source: [base-dict, enhanced]

- lemma: tarem
  ipa: tarem
  pos: conjunction
  gloss: before
  definition: Earlier relative time; purely temporal (spatial "in front of" is dakhan).
  status: canon
  source: [enhanced, decision:D5]

- lemma: îtâsh
  ipa: ɪtʌʃ
  pos: adverb
  gloss: still
  definition: Continuing state ("I am still eating").
  status: canon
  source: [base-dict]

- lemma: nanaqa
  ipa: nanaka
  pos: adverb
  gloss: at the same time
  status: canon
  source: [base-dict]
