# ---- Position positionals ------------------------------------------------------

- lemma: yat
  ipa: jat
  pos: preposition
  gloss: in
  definition: Location inside; extends to abstract targets (muvat yat shiä, "trust in the moon").
  status: canon
  source: [base-dict, legend]

- lemma: laya
  ipa: laja
  pos: preposition
  gloss: on
  status: canon
  source: [base-dict, legend]

- lemma: vayu
  ipa: vaju
  pos: preposition
  gloss: next to
  status: canon
  source: [base-dict]

- lemma: abiya
  ipa: abija
  pos: preposition
  gloss: between
  status: canon
  source: [base-dict]

- lemma: inela
  ipa: inela
  pos: preposition
  gloss: among
  status: canon
  source: [base-dict]

- lemma: dakhan
  ipa: daχan
  pos: preposition
  gloss: in front of
