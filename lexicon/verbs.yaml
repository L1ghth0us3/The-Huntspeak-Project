# Verb roots. Prefix verbs (v-, sh-, kh-, r-, d-, s-, sh-d-) are in core.yaml.
# Conjugation: docs/grammar/03-verbs.md. Format: lexicon/SCHEMA.md

- lemma: v-q-sh
  ipa: v-k-ʃ
  pos: verb-root
  gloss: to love, to have love
  root: v-q-sh
  status: canon
  source: [official-canon, base-dict]
  notes: >-
    Listed as a root in official canon; transparently related to v- "have" +
    qäsh "love". The canon phrase "î veqash su" (I love you) is treated as
    fixed - see phrases.yaml and open question D11.

