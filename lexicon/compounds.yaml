- lemma: khiädyasa
  ipa: χiædjasa
  pos: noun
  gloss: Huntspeak (hunting register)
  definition: Literally "hunt-voice"; the signalling register of clicks, whistles, and calls used on the hunt.
  parts: [khiäd, yasa]
  status: provisional
  source: [enhanced]
  notes: Matches official canon's description of the clicks-and-whistles register; the name itself is a fan coinage.

