# The roleplay expansion set from the cheatsheet: insults, swears, nicknames.
# Status per decision D6: provisional (sha and khât were accepted - see phrases.yaml).
# Items marked "undocumented root" contain material attested nowhere else;
# each needs an etymology or explicit acceptance as an opaque root before promotion.

# ---- Compositional (built from existing canon words) ----------------------------

- lemma: ayarevi
  ipa: ajarevi
  pos: noun
  gloss: oblivious fool
  definition: Literally "far-eye"; one who does not see what is in front of them.
  parts: [ayar, evi]
  status: provisional
  source: [cheatsheet]

- lemma: ayaridwa
  ipa: ajaridʋa
  pos: noun
  gloss: one who will not listen
  definition: Literally "far-ear".
  parts: [ayar, idwa]
  status: provisional
  source: [cheatsheet]

- lemma: naaqevi
