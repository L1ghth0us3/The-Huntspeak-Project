# ---- Grammatical affixes -------------------------------------------------------

- lemma: -du
  pos: affix
  gloss: comparative suffix ("-er, more")
  status: canon
  source: [base-dict]

- lemma: -vu
  pos: affix
  gloss: superlative suffix ("-est, most")
  status: canon
  source: [base-dict]

- lemma: -'qe
  ipa: .ke
  pos: affix
  gloss: imperative suffix
  definition: Attaches to the end of a verb to force the imperative.
  status: canon
  source: [base-dict, legend]

- lemma: -ba
  ipa: ba
  pos: affix
  gloss: auxiliary-verb suffix
  definition: Attached to the auxiliary verb that supports a main verb (qîrad-ba lîba ... "want to eat ...").
  status: canon
  source: [base-dict, base-grammar]

- lemma: -si
  ipa: si
  pos: affix
  gloss: adjectivizer ("-ly, -y")
  definition: Derives adjectives from nouns (ikhel-si "deadly"). Legend also uses it adverbially on an adjective (budai-si "slowly"), that use is provisional.
  status: canon
  source: [base-grammar, legend]

# ---- Prefix verbs (irregular) ---------------------------------------------------

- lemma: v-
  pos: prefix-verb
  gloss: to have, to own
  definition: Prefixes to a noun (vaqäsh "to have love"). Carries the tense vowel only, never a subject vowel (decision D8).
  status: canon
  source: [base-dict, official-canon]

- lemma: sh-
  ipa: ʃ
  pos: prefix-verb
  gloss: to be
  definition: Copula; prefixes to adjectives or nouns (shaqin "to be queen", sha-shidyävu "is a friend").
  status: canon
  source: [base-dict]

- lemma: kh-
  ipa: χ
  pos: prefix-verb
  gloss: to hunt
  status: canon
  source: [base-dict, legend]

- lemma: r-
  ipa: r
  pos: prefix-verb
  gloss: to do, to make
  status: canon
  source: [base-dict, legend]

- lemma: d-
  ipa: d
  pos: prefix-verb
  gloss: to cause
  definition: Builds causatives (danenad "cause to move"). Tense vowel only (decision D8).
  status: canon
  source: [base-dict, base-grammar]

- lemma: s-
  ipa: s
  pos: prefix-verb
  gloss: can, to be able to
  status: canon
  source: [base-dict]

- lemma: sh-d-
  ipa: ʃ-d
  pos: prefix-verb
  gloss: to become
  definition: Both vowel slots carry the tense (shudu- "became", past long).
  status: canon
  source: [base-dict, legend]
